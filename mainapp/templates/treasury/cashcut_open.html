{% extends "mainapp/layout.html" %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->
<section class="section-conten padding-y" style="min-height:84vh; background: #e0e0e0;">



  <!-- ============================ COMPONENT NEW CASHCUT   ================================= -->
      <div class="card mx-auto" style="max-width: 380px; margin-top:100px; background: #f5f5f5">
        <div class="card-body">
        <h4 class="card-title mb-4">Ingresa tu fondo inicial.</h4>
        {% include "mainapp/includes/alerts.html" %}
        <form action="{% url 'initial_cr' %}" method="POST">
          {% csrf_token %}
          {% if cashregisters %}
          
                <div class="form-group">          
                    <!-- customers es un QuerySet (instancias) de Customer-->
                    <label for="cr_selected">Caja por abrir:</label>
                    <select name="cr_selected" class="form-control blocked" required>
                        <option value="" disabled selected>Elija una opción</option> <!--primera opcion deshabilitada, para mensaje-->
                        <!-- Iteración de clientes-->
                        {% for cashregister in cashregisters %}
                                <option value="{{cashregister.id}}">
                                      {{cashregister.name|capfirst}} | <small class="text-muted">{{cashregister.get_status_display}} </small>
                                </option>
                        {% endfor %}
                    </select>
                
                    
                </div> <!-- row. -->
          
            <div class="form-group">
              <label>Fondo inicial</label>
              <input name="initial" type="number" class="form-control" min="0.01" step="0.01" placeholder="0.00" required>
            </div> <!-- form-group// -->
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block"> Iniciar corte  </button>
            </div> <!-- form-group// -->    
          {% else %}
            <h5 class="card-title mb-4">No hay cajas activas, crea una en Admin.</h5>
            <div class="form-group">
                <a href="{% url 'logout' %}" class="btn btn-primary btn-block">Salir</a>
            </div> <!-- form-group// -->    
          {% endif %}
        </form>
        </div> <!-- card-body.// -->
      </div> <!-- card .// -->
  
        <!--<p class="text-center mt-4">¿No tienes cuenta? <a href=" {% url "register" %} ">Crea tu cuenta</a></p>-->
        <br><br>
  <!-- ============================ COMPONENT LOGIN  END.// ================================= -->
  

    </section>
    <!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock content %}
